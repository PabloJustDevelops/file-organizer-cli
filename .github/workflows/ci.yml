name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  cli:
    name: CLI — lint, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/cli
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install
        working-directory: .

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun run test

      - name: Coverage gate
        run: bun run test:coverage

      - name: Build
        run: bun run build
