name: Release

# Publica en npm cuando se crea una release de GitHub. El tag de la release
# manda: si no coincide con la versión de packages/cli/package.json, el job
# para antes de publicar nada.
on:
  release:
    types: [created]

permissions:
  contents: read

env:
  BUN_VERSION: "1.4.2"

jobs:
  verify:
    name: Verificar y construir · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Instalar dependencias
        run: bun install --frozen-lockfile

      - name: Pruebas
        run: bun run test
        working-directory: packages/cli

      - name: Build
        run: bun run build
        working-directory: packages/cli

      - name: Subir artefactos
        uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.os }}
          path: packages/cli/dist/
          if-no-files-found: error

  publish:
    name: Publicar en npm
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      # Publicación sin secreto vía trusted publishing de npm (OIDC) y
      # procedencia firmada. Si el repositorio tiene `NPM_TOKEN` configurado,
      # ese camino sigue funcionando.
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Instalar dependencias
        run: bun install --frozen-lockfile

      # Una release etiquetada v0.2.0 mientras el paquete dice 0.1.0-rc.1
      # publica lo que no es: la comprobación va antes del build.
      - name: Comprobar tag contra package.json
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="$(node -p "require('./packages/cli/package.json').version")"
          if [ "$TAG" != "v$VERSION" ] && [ "$TAG" != "$VERSION" ]; then
            echo "FAIL: la etiqueta '$TAG' no coincide con la versión '$VERSION' de packages/cli/package.json"
            exit 1
          fi
          echo "OK: etiqueta '$TAG' == versión '$VERSION'"

      - name: Build
        run: bun run build
        working-directory: packages/cli

      - name: Publish to npm
        working-directory: packages/cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          if [[ "$VERSION" == *-* ]]; then
            TAG="${VERSION#*-}"
            TAG="${TAG%%.*}"
          else
            TAG="latest"
          fi
          echo "Publishing $VERSION with dist-tag: $TAG"
          npm publish --tag "$TAG" --provenance
